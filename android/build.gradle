// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

rootProject.ext.getGfxreconVersionInfo = { buildType ->
    def proc = ["cmake", "-P", "../cmake/GenerateVersionARM.cmake", "-BUILD_TYPE=${buildType}"].execute(null, rootProject.rootDir)
    def output = new StringWriter()
    proc.waitForProcessOutput(output, output)
    def versionName = "unknown"
    def versionCode = 1
    output.toString().eachLine { line ->
        if (line.contains("GFXRECON_VERSION_STRING_ARM=")) {
            versionName = line.split("=", 2)[1].trim()
        }
        if (line.contains("GFXRECON_VERSION_INT_ARM=")) {
            versionCode = line.split("=", 2)[1].trim().toInteger()
        }
    }
    return [versionName, versionCode]
}
