apply plugin: 'com.android.application'

android {
    def propMaxThreadsPerBuildTask = providers.gradleProperty("MaxThreadsPerBuildTask")
    def propEnableCcache = providers.gradleProperty("EnableCcache")

    compileSdkVersion 34
    namespace 'com.lunarg.gfxreconstruct.replay'
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId "com.lunarg.gfxreconstruct.replay"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        ndk {
            if (project.hasProperty("armeabi-v7a")) {
                abiFilters 'armeabi-v7a'
            } else if (project.hasProperty("arm64-v8a")) {
                abiFilters 'arm64-v8a'
            } else if (project.hasProperty("x86")) {
                abiFilters 'x86'
            } else if (project.hasProperty("x86_64")) {
                abiFilters 'x86_64'
            } else {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions", "-Wno-nullability-completeness"
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_STL=c++_static"

                if (propMaxThreadsPerBuildTask.present) {
                    arguments.add("-DCMAKE_JOB_POOL_COMPILE:STRING=build")
                    arguments.add("-DCMAKE_JOB_POOL_LINK:STRING=build")
                    arguments.add("-DCMAKE_JOB_POOLS:STRING=build=${propMaxThreadsPerBuildTask.get()}")
                }

                if (propEnableCcache.present) {
                    arguments.add("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
                    arguments.add("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
                }
            }
        }
    }
    applicationVariants.all { variant ->
        def buildType = variant.buildType.name.capitalize()
        def (versionName, versionCode) = rootProject.ext.getGfxreconVersionInfo(buildType)
        variant.outputs.each { output ->
            output.versionNameOverride = versionName
        }
    }
    signingConfigs {
        debug {
            storeFile file('../../keystore')
            storePassword 'GfxReconKey'
            keyAlias 'key-gfxrecon'
            keyPassword 'GfxReconKey'
        }
        release {
            storeFile file('../../keystore')
            storePassword 'GfxReconKey'
            keyPassword 'GfxReconKey'
            keyAlias 'key-gfxrecon'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
            signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    androidResources {
        ignoreAssetsPattern "XrLayer_gfxreconstruct.json"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.0'
    implementation project(':layer')
}
